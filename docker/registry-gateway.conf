# The worker's only way out of its network, which has no route anywhere else (docker-compose.yml). Each listener forwards
# raw TCP to one fixed destination and picks nothing from what the client sends, so there is no address to ask for instead.
# TLS passes through untouched: pnpm checks the registry's own certificate, and this container sees no content.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

stream {
    # Public resolvers, not Docker's: Docker's answers `registry.npmjs.org` with this container's own alias, a loop.
    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=60s;
    proxy_connect_timeout 10s;
    proxy_timeout 2m;

    # Always tried: left to its default, nginx gives up on an API that was away for ten seconds after it is back.
    upstream api_on_the_machine {
        server host.docker.internal:4100 max_fails=0;
    }

    server {
        listen 443;
        # In a variable, so that the name is looked up as it changes and not only at start-up.
        set $registry registry.npmjs.org:443;
        proxy_pass $registry;
    }

    # The API on the machine during `pnpm dev`. The name is this container's `extra_hosts` entry, read at start-up.
    server {
        listen 4100;
        proxy_pass api_on_the_machine;
    }
}
