name: Bug report
description: Something in the app, the API or the worker does not work as it should.
labels: [bug]
body:
    - type: markdown
      attributes:
          value: Thanks for taking the time to report this. For a security problem, use a private report instead (see SECURITY.md).
    - type: textarea
      id: what
      attributes:
          label: What happened
          description: What you saw, and what you expected instead.
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          description: Include the URL (it carries the package, the version and the trends view) when it helps.
          placeholder: |
              1. Open https://…/package/react@19.1.0
              2. Click …
      validations:
          required: true
    - type: dropdown
      id: where
      attributes:
          label: Where
          options:
              - Web app
              - Public API
              - Worker (Docker)
              - Development setup
      validations:
          required: true
    - type: input
      id: environment
      attributes:
          label: Browser and OS, or Node version
          placeholder: Firefox 131 on macOS 15 / Node 24.22.1
    - type: textarea
      id: logs
      attributes:
          label: Logs or screenshots
          description: Console errors, backend or worker log lines (`pnpm worker:logs`) or a screenshot. Remove anything private, such as tokens.
          render: text
